

services:
  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.m.daocloud.io/immich-app/immich-machine-learning:v3-openvino
    extends:
      file: hwaccel.ml.yml
      service: openvino
    environment:
      - TZ=Asia/Shanghai
      - HTTP_PROXY=http://192.168.68.199:7890
      - HTTPS_PROXY=http://192.168.68.199:7890
      - http_proxy=http://192.168.68.199:7890
      - https_proxy=http://192.168.68.199:7890
      - NO_PROXY=localhost,127.0.0.1,immich_server,immich_machine_learning,immich-machine-learning,immich_postgres,immich_redis,.local,172.16.0.0/12
      - no_proxy=localhost,127.0.0.1,immich_server,immich_machine_learning,immich-machine-learning,immich_postgres,immich_redis,.local,172.16.0.0/12
    volumes:
      - /share/Container/immich/model-cache:/cache
    ports:
      - "3003:3003"
    networks:
      - immich_net
    restart: always

  # 如果你还需要运行其他 Immich 服务，可以在这里继续添加
  # 例如 immich-server、immich-microservices、redis、postgres 等
  # 但这里只保留了 ML 服务的配置，其余服务请根据你的实际部署情况自行添加

networks:
  immich_net:
    driver: bridge